<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="344" viewBox="0 0 1020 344" role="img" aria-label="From reproducible source to presentation">
<title>From reproducible source to presentation</title>
<rect width="1020" height="344" rx="20" fill="#0c1425"/>
<text x="36" y="49" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#f3f7ff">From reproducible source to presentation</text>
<text x="36" y="79" font-family="Arial,sans-serif" font-size="15" fill="#9fb2c7">TOML or Python defines the content; exporters have separate platform requirements.</text>
<rect x="21" y="105" width="225" height="174" rx="14" fill="#17243a" stroke="#3c526b" stroke-width="1.5"/><rect x="35" y="122" width="30" height="30" rx="9" fill="#174a52"/><text x="50" y="143" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#5dd6bd">1</text><text x="73" y="144" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#f3f7ff">Define deck</text><text x="37" y="183" font-family="Arial,sans-serif" font-size="14" fill="#9fb2c7">deck.toml</text><text x="37" y="209" font-family="Arial,sans-serif" font-size="14" fill="#9fb2c7">equations and SVG</text><text x="37" y="235" font-family="Arial,sans-serif" font-size="14" fill="#9fb2c7">Python API option</text><text x="37" y="261" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#5dd6bd">SOURCE</text><path d="M 251 192 H 265" stroke="#5dd6bd" stroke-width="2.5" stroke-linecap="round"/><path d="M 259 186 L 266 192 L 259 198" fill="none" stroke="#5dd6bd" stroke-width="2.5" stroke-linecap="round"/><rect x="272" y="105" width="225" height="174" rx="14" fill="#17243a" stroke="#3c526b" stroke-width="1.5"/><rect x="286" y="122" width="30" height="30" rx="9" fill="#174a52"/><text x="301" y="143" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#5dd6bd">2</text><text x="324" y="144" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#f3f7ff">Build</text><text x="288" y="183" font-family="Arial,sans-serif" font-size="14" fill="#9fb2c7">slideforge build</text><text x="288" y="209" font-family="Arial,sans-serif" font-size="14" fill="#9fb2c7">layout + figures</text><text x="288" y="235" font-family="Arial,sans-serif" font-size="14" fill="#9fb2c7">math routing</text><text x="288" y="261" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#5dd6bd">PYTHON TOOL</text><path d="M 502 192 H 516" stroke="#5dd6bd" stroke-width="2.5" stroke-linecap="round"/><path d="M 510 186 L 517 192 L 510 198" fill="none" stroke="#5dd6bd" stroke-width="2.5" stroke-linecap="round"/><rect x="523" y="105" width="225" height="174" rx="14" fill="#17243a" stroke="#3c526b" stroke-width="1.5"/><rect x="537" y="122" width="30" height="30" rx="9" fill="#174a52"/><text x="552" y="143" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#5dd6bd">3</text><text x="575" y="144" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#f3f7ff">PowerPoint</text><text x="539" y="183" font-family="Arial,sans-serif" font-size="14" fill="#9fb2c7">deck.pptx</text><text x="539" y="209" font-family="Arial,sans-serif" font-size="14" fill="#9fb2c7">native Office math</text><text x="539" y="235" font-family="Arial,sans-serif" font-size="14" fill="#9fb2c7">editable slide objects</text><text x="539" y="261" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#5dd6bd">CORE OUTPUT</text><path d="M 753 192 H 767" stroke="#5dd6bd" stroke-width="2.5" stroke-linecap="round"/><path d="M 761 186 L 768 192 L 761 198" fill="none" stroke="#5dd6bd" stroke-width="2.5" stroke-linecap="round"/><rect x="774" y="105" width="225" height="174" rx="14" fill="#17243a" stroke="#3c526b" stroke-width="1.5"/><rect x="788" y="122" width="30" height="30" rx="9" fill="#174a52"/><text x="803" y="143" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#5dd6bd">4</text><text x="826" y="144" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#f3f7ff">Optional exports</text><text x="790" y="183" font-family="Arial,sans-serif" font-size="14" fill="#9fb2c7">PDF / slide PNGs</text><text x="790" y="209" font-family="Arial,sans-serif" font-size="14" fill="#9fb2c7">PowerPoint (Windows)</text><text x="790" y="235" font-family="Arial,sans-serif" font-size="14" fill="#9fb2c7">or LibreOffice PDF</text><text x="790" y="261" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#5dd6bd">REQUIRES BACKEND</text>
<line x1="36" y1="300" x2="984" y2="300" stroke="#3c526b" stroke-width="1"/>
<text x="36" y="324" font-family="Arial,sans-serif" font-size="14" fill="#fbbf78">TeX math is an SVG image; Office Math is editable. Export support varies by platform.</text>
