[project]
name = "slideforge"
version = "0.1.0"
description = "Build PowerPoint decks from Python and TOML: native equations, vector figures, PDF export"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Isaac Yong", email = "isaacyong@naver.com" }]
keywords = ["powerpoint", "pptx", "latex", "omml", "equations", "slides"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
requires-python = ">=3.12"
dependencies = [
    "latex2mathml>=3.77",
    "lxml>=5",
    "python-pptx>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[project.scripts]
slideforge = "slideforge.cli:main"

[project.urls]
Repository = "https://github.com/NaNIsaac/slideforge"
Issues = "https://github.com/NaNIsaac/slideforge/issues"

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]
